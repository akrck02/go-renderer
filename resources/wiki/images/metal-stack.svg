<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .accent { fill: #ddf4ff; stroke: #54aeff; }
    .hand { fill: #fff8c5; stroke: #d4a72c; }
    .title { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .text { fill: #59636e; font-size: 12.5px; }
    .code { fill: #0969da; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .label { fill: #59636e; font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .arrow { stroke: #8c959f; stroke-width: 1.6; fill: none; }
    .head { fill: #8c959f; }
    .bar { fill: #d0d7de; }
    .barnew { fill: #54aeff; }
    .grid { stroke: #eaeef2; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; }
      .accent { fill: #0c2d4b; stroke: #1f6feb; }
      .hand { fill: #2e2a14; stroke: #9e6a03; }
      .title { fill: #e6edf3; }
      .text { fill: #9198a1; }
      .code { fill: #4493f8; }
      .label { fill: #9198a1; }
      .arrow { stroke: #6e7681; }
      .head { fill: #6e7681; }
      .bar { fill: #3d444d; }
      .barnew { fill: #1f6feb; }
      .grid { stroke: #21262d; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="880" height="280" rx="12"/>
  <rect class="box" x="24" y="40" width="180" height="84" rx="10" stroke-width="1.2"/>
  <text class="code" x="114.0" y="66" text-anchor="middle">draw2d.List</text>
  <text class="title" x="114.0" y="88" text-anchor="middle">An interface</text>
  <text class="text" x="114.0" y="110" text-anchor="middle">what go-ui draws</text>
  <path class="arrow" d="M204,82 H252" marker-end="url(#arrow)"/>
  <rect class="box" x="256" y="40" width="220" height="84" rx="10" stroke-width="1.2"/>
  <text class="code" x="366.0" y="66" text-anchor="middle">opengl/overlay</text>
  <text class="title" x="366.0" y="88" text-anchor="middle">The painter</text>
  <text class="text" x="366.0" y="110" text-anchor="middle">quads of one atlas, plain Go</text>
  <path class="arrow" d="M476,70 C510,70 510,52 548,52" marker-end="url(#arrow)"/>
  <path class="arrow" d="M476,96 C510,96 510,138 548,138" marker-end="url(#arrow)"/>
  <rect class="accent" x="552" y="14" width="304" height="72" rx="10" stroke-width="1.2"/>
  <text class="code" x="570" y="40" text-anchor="start">metal.FlatRenderer</text>
  <text class="title" x="570" y="62" text-anchor="start">Metal, on macOS</text>
  <rect class="box" x="552" y="100" width="304" height="72" rx="10" stroke-width="1.2"/>
  <text class="code" x="570" y="126" text-anchor="start">opengl.FlatRenderer</text>
  <text class="title" x="570" y="148" text-anchor="start">OpenGL, elsewhere</text>
  <rect class="box" x="24" y="196" width="832" height="64" rx="10" stroke-width="1.2"/>
  <text class="code" x="440.0" y="222" text-anchor="middle">windowloop</text>
  <text class="title" x="440.0" y="244" text-anchor="middle">One window loop for both: GLFW events, drawing on demand, resizing</text>
