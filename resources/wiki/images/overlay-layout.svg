<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .accent { fill: #ddf4ff; stroke: #54aeff; }
    .hand { fill: #fff8c5; stroke: #d4a72c; }
    .title { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .text { fill: #59636e; font-size: 12.5px; }
    .code { fill: #0969da; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .label { fill: #59636e; font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .arrow { stroke: #8c959f; stroke-width: 1.6; fill: none; }
    .head { fill: #8c959f; }
    .bar { fill: #d0d7de; }
    .barnew { fill: #54aeff; }
    .grid { stroke: #eaeef2; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; }
      .accent { fill: #0c2d4b; stroke: #1f6feb; }
      .hand { fill: #2e2a14; stroke: #9e6a03; }
      .title { fill: #e6edf3; }
      .text { fill: #9198a1; }
      .code { fill: #4493f8; }
      .label { fill: #9198a1; }
      .arrow { stroke: #6e7681; }
      .head { fill: #6e7681; }
      .bar { fill: #3d444d; }
      .barnew { fill: #1f6feb; }
      .grid { stroke: #21262d; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="880" height="400" rx="12"/>
  <rect class="box" x="24" y="20" width="832" height="360" rx="10" stroke-width="1.2"/>
  <rect class="accent" x="48" y="44" width="230" height="72" rx="10" stroke-width="1.2"/>
  <text class="title" x="68" y="72">(clock)  08:00</text>
  <text class="text" x="68" y="98">(sailboat)  4 boats in · 2 out</text>
  <text class="label" x="300" y="72" text-anchor="start">the header: one line per pinned item</text>
  <rect class="accent" x="48" y="132" width="250" height="30" rx="15" stroke-width="1.2"/>
  <text class="text" x="66" y="152">(anchor)  A boat moored at the quay</text>
  <rect class="accent" x="48" y="170" width="250" height="30" rx="15" stroke-width="1.2" opacity="0.55"/>
  <text class="text" x="66" y="190" opacity="0.55">(lighthouse)  The lamp is lit</text>
  <text class="label" x="320" y="172" text-anchor="start">notices: newest first, fading after a few seconds</text>
  <rect class="bg" x="470" y="236" width="190" height="32" rx="16" stroke="#8c959f" stroke-width="1"/>
  <text class="title" x="565" y="257" text-anchor="middle" font-size="13">(house)  Harbour house</text>
  <rect class="bg" x="540" y="274" width="50" height="22" rx="11" stroke="#8c959f" stroke-width="1"/>
  <text class="label" x="565" y="289" text-anchor="middle">open</text>
  <rect class="hand" x="545" y="318" width="40" height="34" rx="4" stroke-width="1.2"/>
  <text class="label" x="670" y="258" text-anchor="start">a label: icon and text</text>
  <text class="label" x="670" y="290" text-anchor="start">a badge under it</text>
  <text class="label" x="670" y="340" text-anchor="start">the thing it belongs to</text>
  <path class="arrow" d="M664,336 H594" marker-end="url(#arrow)"/>
</svg>
