<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .accent { fill: #ddf4ff; stroke: #54aeff; }
    .hand { fill: #fff8c5; stroke: #d4a72c; }
    .title { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .text { fill: #59636e; font-size: 12.5px; }
    .code { fill: #0969da; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .label { fill: #59636e; font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .arrow { stroke: #8c959f; stroke-width: 1.6; fill: none; }
    .head { fill: #8c959f; }
    .bar { fill: #d0d7de; }
    .barnew { fill: #54aeff; }
    .grid { stroke: #eaeef2; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; }
      .accent { fill: #0c2d4b; stroke: #1f6feb; }
      .hand { fill: #2e2a14; stroke: #9e6a03; }
      .title { fill: #e6edf3; }
      .text { fill: #9198a1; }
      .code { fill: #4493f8; }
      .label { fill: #9198a1; }
      .arrow { stroke: #6e7681; }
      .head { fill: #6e7681; }
      .bar { fill: #3d444d; }
      .barnew { fill: #1f6feb; }
      .grid { stroke: #21262d; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="880" height="330" rx="12"/>
  <rect class="box" x="24" y="110" width="170" height="110" rx="10" stroke-width="1.2"/>
  <text class="code" x="109.0" y="136" text-anchor="middle">scene.glb</text>
  <text class="title" x="109.0" y="158" text-anchor="middle">A scene</text>
  <text class="text" x="109.0" y="180" text-anchor="middle">glTF, or built in Go</text>
  <path class="arrow" d="M194,165 H246" marker-end="url(#arrow)"/>
  <rect class="accent" x="250" y="85" width="240" height="160" rx="10" stroke-width="1.2"/>
  <text class="code" x="370.0" y="111" text-anchor="middle">scene + sceneplan</text>
  <text class="title" x="370.0" y="133" text-anchor="middle">What a frame draws</text>
  <text class="text" x="370.0" y="155" text-anchor="middle">nodes, instances, sky, water,</text>
  <text class="text" x="370.0" y="172" text-anchor="middle">culling and levels of detail,</text>
  <text class="text" x="370.0" y="189" text-anchor="middle">decided once, with no</text>
  <text class="text" x="370.0" y="206" text-anchor="middle">graphics calls</text>
  <path class="arrow" d="M490,125 C530,125 530,62 572,62" marker-end="url(#arrow)"/>
  <path class="arrow" d="M490,165 H572" marker-end="url(#arrow)"/>
  <path class="arrow" d="M490,205 C530,205 530,268 572,268" marker-end="url(#arrow)"/>
  <text class="label" x="531" y="48" text-anchor="middle">opengl</text>
  <text class="label" x="531" y="157" text-anchor="middle">metal</text>
  <text class="label" x="531" y="300" text-anchor="middle">gles</text>
  <rect class="box" x="576" y="20" width="280" height="84" rx="10" stroke-width="1.2"/>
  <text class="title" x="594" y="46" text-anchor="start">A desktop window</text>
  <text class="text" x="594" y="68" text-anchor="start">OpenGL 4.1, on any desktop:</text>
  <text class="text" x="594" y="85" text-anchor="start">the viewer and its captures</text>
  <rect class="box" x="576" y="128" width="280" height="74" rx="10" stroke-width="1.2"/>
  <text class="title" x="594" y="154" text-anchor="start">A Mac, through Metal</text>
  <text class="text" x="594" y="176" text-anchor="start">the same frame; the viewer's default</text>
  <rect class="box" x="576" y="226" width="280" height="84" rx="10" stroke-width="1.2"/>
  <text class="title" x="594" y="252" text-anchor="start">A web page or a phone</text>
  <text class="text" x="594" y="274" text-anchor="start">WebGL2 in a browser,</text>
  <text class="text" x="594" y="291" text-anchor="start">OpenGL ES on Android</text>
</svg>
