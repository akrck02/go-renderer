<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 192" width="880" height="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .accent { fill: #ddf4ff; stroke: #54aeff; }
    .hand { fill: #fff8c5; stroke: #d4a72c; }
    .title { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .text { fill: #59636e; font-size: 12.5px; }
    .code { fill: #0969da; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .label { fill: #59636e; font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .arrow { stroke: #8c959f; stroke-width: 1.6; fill: none; }
    .head { fill: #8c959f; }
    .bar { fill: #d0d7de; }
    .barnew { fill: #54aeff; }
    .grid { stroke: #eaeef2; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; }
      .accent { fill: #0c2d4b; stroke: #1f6feb; }
      .hand { fill: #2e2a14; stroke: #9e6a03; }
      .title { fill: #e6edf3; }
      .text { fill: #9198a1; }
      .code { fill: #4493f8; }
      .label { fill: #9198a1; }
      .arrow { stroke: #6e7681; }
      .head { fill: #6e7681; }
      .bar { fill: #3d444d; }
      .barnew { fill: #1f6feb; }
      .grid { stroke: #21262d; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="880" height="192" rx="12"/>
  <rect class="box" x="24" y="40" width="120" height="112" rx="10" stroke-width="1.2"/>
  <text class="code" x="84.0" y="66" text-anchor="middle">1</text>
  <text class="title" x="84.0" y="88" text-anchor="middle">Culling</text>
  <text class="text" x="84.0" y="110" text-anchor="middle">what is in view,</text>
  <text class="text" x="84.0" y="127" text-anchor="middle">at what detail</text>
  <path class="arrow" d="M144,96 H164" marker-end="url(#arrow)"/>
  <rect class="box" x="166" y="40" width="120" height="112" rx="10" stroke-width="1.2"/>
  <text class="code" x="226.0" y="66" text-anchor="middle">2</text>
  <text class="title" x="226.0" y="88" text-anchor="middle">Shadows</text>
  <text class="text" x="226.0" y="110" text-anchor="middle">the scene seen</text>
  <text class="text" x="226.0" y="127" text-anchor="middle">from the sun</text>
  <path class="arrow" d="M286,96 H306" marker-end="url(#arrow)"/>
  <rect class="box" x="308" y="40" width="120" height="112" rx="10" stroke-width="1.2"/>
  <text class="code" x="368.0" y="66" text-anchor="middle">3</text>
  <text class="title" x="368.0" y="88" text-anchor="middle">Sky</text>
  <text class="text" x="368.0" y="110" text-anchor="middle">day, night,</text>
  <text class="text" x="368.0" y="127" text-anchor="middle">stars, clouds</text>
  <path class="arrow" d="M428,96 H448" marker-end="url(#arrow)"/>
  <rect class="accent" x="450" y="40" width="120" height="112" rx="10" stroke-width="1.2"/>
  <text class="code" x="510.0" y="66" text-anchor="middle">4</text>
  <text class="title" x="510.0" y="88" text-anchor="middle">Scene</text>
  <text class="text" x="510.0" y="110" text-anchor="middle">light, fog, patterns,</text>
  <text class="text" x="510.0" y="127" text-anchor="middle">snow, wind</text>
  <path class="arrow" d="M570,96 H590" marker-end="url(#arrow)"/>
  <rect class="box" x="592" y="40" width="120" height="112" rx="10" stroke-width="1.2"/>
  <text class="code" x="652.0" y="66" text-anchor="middle">5</text>
  <text class="title" x="652.0" y="88" text-anchor="middle">Water</text>
  <text class="text" x="652.0" y="110" text-anchor="middle">depth, waves,</text>
  <text class="text" x="652.0" y="127" text-anchor="middle">tides, foam</text>
  <path class="arrow" d="M712,96 H732" marker-end="url(#arrow)"/>
  <rect class="accent" x="734" y="40" width="120" height="112" rx="10" stroke-width="1.2"/>
  <text class="code" x="794.0" y="66" text-anchor="middle">6</text>
  <text class="title" x="794.0" y="88" text-anchor="middle">Overlay</text>
  <text class="text" x="794.0" y="110" text-anchor="middle">labels, header,</text>
  <text class="text" x="794.0" y="127" text-anchor="middle">notices, drawing</text>
</svg>
