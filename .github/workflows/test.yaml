# Checks every push and pull request: the formatter, the linter and the tests.
name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: OpenGL's, X11's and Wayland's headers, which the GLFW window builds against
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - name: Formatted
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
  browser:
    # The packages a web page uses, vetted as WebAssembly: the desktop window (GLFW) does not build there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet for the browser
        env:
          GOOS: js
          GOARCH: wasm
        run: go vet ./browser ./cmd/web-island ./gles ./frameloop ./input ./draw2d ./graphics ./camera ./loaders ./models ./scene/... ./sceneplan ./opengl/overlay/...
